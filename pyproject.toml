[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fitness-programming-toolkit"
version = "0.1.0"
description = "Offline Python workout plan validation, training volume summaries and streaming CSV export"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Fitness Programming Toolkit contributors"}]
keywords = ["fitness", "strength-training", "workout-plan", "training-volume", "json-schema", "data-validation", "csv", "streaming", "gym-software"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/splucasaugusto666/fitness-programming-toolkit"
Documentation = "https://github.com/splucasaugusto666/fitness-programming-toolkit/blob/main/docs/API.md"
Issues = "https://github.com/splucasaugusto666/fitness-programming-toolkit/issues"
Changelog = "https://github.com/splucasaugusto666/fitness-programming-toolkit/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["jsonschema>=4.23,<5"]
mcp = ["mcp>=2,<3"]

[project.scripts]
fptk = "fitness_programming_toolkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fitness_programming_toolkit = ["program-1.0.schema.json"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]
