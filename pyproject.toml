[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fitness-programming-toolkit"
version = "0.1.0"
description = "Offline validation, summaries and safe CSV export for strength-training plans"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Fitness Programming Toolkit contributors"}]
keywords = ["fitness", "strength-training", "workout", "validation", "csv"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
test = ["jsonschema>=4.23,<5"]

[project.scripts]
fptk = "fitness_programming_toolkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]
