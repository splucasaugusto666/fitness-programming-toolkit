name: Python CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.11'
          - os: ubuntu-latest
            python-version: '3.12'
          - os: ubuntu-latest
            python-version: '3.13'
          - os: windows-latest
            python-version: '3.13'
          - os: macos-latest
            python-version: '3.13'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and lint tool
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]' ruff
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile
        run: python -m compileall -q src tests
      - name: CLI smoke test
        run: |
          fptk validate examples/strength_program.json
          fptk summary examples/strength_program.json

  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build source and wheel distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Check distribution and isolated installation
        run: python tools/check_distribution.py
